txt","bytes":1080,"sha256":"51887a3d47051ac2fce1210562e5b9fe0830a8a8fabeb272c2d586eeb18a05fd"},{"path":"licenses/seedrandom-LICENSE.txt","bytes":1079,"sha256":"7500bc57d010cde21006d88014d7191f36be1750894bfc4a01ce3844f1f9af2e"},{"path":"licenses/tfjs-LICENSE.txt","bytes":11358,"sha256":"cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"},{"path":"licenses/tfjs-layers-LICENSE.txt","bytes":13216,"sha256":"a79c269bc0e74de72571cea54c5f92ed74cbc6e8d1250a9fdb40357383d9dc4b"},{"path":"licenses/three-LICENSE.txt","bytes":1081,"sha256":"8b378ebe60e2fe500158cb0ac71cb5e8b7d92953c2abcc63a0eb90499653b5bc"},{"path":"licenses/tslib-CopyrightNotice.txt","bytes":822,"sha256":"da16ddb65f8ca390998fb99223d0112498b56b45784d00afd77ff8ce1ac4de8b"},{"path":"licenses/tslib-LICENSE.txt","bytes":655,"sha256":"210b19e543130388c68654b7497e967119ce17145f66ab7d85688fbd70f08751"},{"path":"model.json","bytes":168013,"sha256":"c65a3447162efa0c42af29498a4b151f4415b36ff3ae6fae2b28a32e840dcbfb"},{"path":"pose-detection.min.js","bytes":72653,"sha256":"eedb38254421de21571e88db202382104b98f36de221a94f956d7bd01f43abcd"},{"path":"scene.glb","bytes":693828,"sha256":"9a73e9b020a4e8e4672cc2a8dbbf30029bcde6cd0a468402a4fde729f26a1d53"},{"path":"style.css","bytes":15248,"sha256":"14ed9bf33efe0b7ffa8eb5a01a0329c9adf800028eb29022135ca56d2e3bece4"},{"path":"t1.bundle.js","bytes":626983,"sha256":"280db4f5ec5f66be2cac1cf36afc4f5ca81cd378a2a7c082db226d6a5819584c"},{"path":"t1.bundle.js.LEGAL.txt","bytes":188,"sha256":"cc7cc7e2f53d5db0235ab2226e85fc6e91655161573b39813b41bb00e5919674"},{"path":"t2.bundle.js","bytes":2854869,"sha256":"3ab4828ff867b1738f8885eeb5fef3d86bcea56b0b3045c3fb5e93bbd2039014"},{"path":"tf.min.js","bytes":1469833,"sha256":"3daeec03303a884a0c1b3314a1dffad572c402ec941ee3638e9b9d64e450964b"},{"path":"visual.mjs","bytes":1406,"sha256":"b0b5c3795df8abef4fc7fd50a49f3f010704e255ba01a9ab45c0f679bf0d60c3"},{"path":"w10/logic/city-guardian.mjs","bytes":6887,"sha256":"e835136d7a8145b87193aee297cb869ef15d8c97761b25acc502a16fd570a16b"},{"path":"w11/gate.mjs","bytes":4481,"sha256":"9531b81e67a9bc4091d54c7243ba7577b945298281d9b29f417147a7731a691b"}], overlays={"index.html":"<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'\">\n  <meta name=\"referrer\" content=\"no-referrer\">\n  <title>光之小队 · 城市守护练习</title>\n  <link rel=\"stylesheet\" href=\"./style.css\">\n  <script type=\"module\" src=\"./experience.mjs\"></script>\n</head>\n<body>\n  <main class=\"shell\">\n    <header class=\"topbar\">\n      <div class=\"brand\">\n        <span class=\"badge-icon\" aria-hidden=\"true\">✦</span>\n        <div><p class=\"eyebrow\">光之小队 · LIGHT FRIENDS</p><h1>一起守护城市！</h1></div>\n      </div>\n      <div class=\"top-tools\">\n        <span id=\"mode-pill\" class=\"mode-pill\">触屏练习 · 无相机</span>\n        <label class=\"volume-label\" for=\"volume\">声音 <input id=\"volume\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.35\"></label>\n        <button id=\"mute\" class=\"icon-button\" type=\"button\" aria-pressed=\"false\">静音</button>\n        <span id=\"audio-state\" class=\"audio-state\" role=\"status\" hidden>声音暂不可用</span>\n      </div>\n    </header>\n\n    <section class=\"choice-bar\" aria-label=\"选择伙伴和城市\">\n      <label class=\"choice\"><span>我的英雄</span><select id=\"hero\"><option value=\"dawn\">晨曦守护者</option><option value=\"star\">星光守护者</option></select></label>\n      <label class=\"choice\"><span>友善伙伴</span><select id=\"friend\"><option value=\"cloud\">云团伙伴</option><option value=\"blob\">布丁伙伴</option></select></label>\n      <label class=\"choice\"><span>我的城市</span><select id=\"city\"><option value=\"dawn\">蓝湾晨光</option><option value=\"sunset\">暖霞城市</option></select></label>\n      <label class=\"choice technical\"><span>3D 候选</span><select id=\"engine\"><option value=\"T1\">Three.js</option></select></label>\n    </section>\n\n    <div class=\"game-layout\">\n      <section class=\"world\" aria-label=\"原创三维世界\">\n        <p id=\"rotate-input-hint\" class=\"rotate-hint\" role=\"note\">横放设备，守护城市会看得更完整。也可以继续竖屏触屏练习。</p>\n        <p id=\"compact-input-mode\" class=\"compact-mode\">触屏练习 · 无相机</p>\n        <div id=\"camera-status-panel\" class=\"camera-status-panel\" hidden>\n          <div class=\"camera-status-copy\">\n            <p id=\"input-status\" role=\"status\" aria-live=\"polite\" hidden>相机未开启</p>\n            <p class=\"camera-alternative\">不使用相机：在「输入方式」选择触屏练习（无相机）。切换会结束当前练习。</p>\n          </div>\n          <button id=\"input-close\" type=\"button\" class=\"button secondary\" hidden>关闭相机</button>\n        </div>\n        <div class=\"scene-view\">\n        <div id=\"stage\" class=\"stage\">\n          <canvas id=\"scene\" width=\"960\" height=\"540\" aria-label=\"原创英雄、友善伙伴和城市 3D 预览\"></canvas>\n          <div class=\"stage-hud\">\n            <span class=\"hud-pill\">光之守护</span>\n            <span class=\"hud-pill world-name\">守护城市</span>\n            <div class=\"stage-tools\">\n              <div class=\"stars\" aria-label=\"本轮星星 0 颗\" id=\"stars\"><span>☆</span><span>☆</span><span>☆</span></div>\n              <button id=\"pause\" type=\"button\" class=\"button secondary stage-pause\" hidden aria-label=\"休息一下\">Ⅱ</button>\n              <button id=\"resume\" type=\"button\" class=\"button primary stage-pause\" hidden aria-label=\"继续练习\">▶</button>\n            </div>\n          </div>\n          <p id=\"visual-status\" class=\"visual-status\" role=\"status\">正在准备原创 3D 场景…</p>\n        </div>\n        <div class=\"stage-footer\">\n          <p class=\"mission-hint stage-guide\" id=\"goal-hint\">先选你喜欢的英雄和伙伴，再点开始练习。</p>\n        </div>\n        </div>\n        <p class=\"safety-note\">轻轻做、慢慢来。无需跳跃、用力或碰到任何人。累了就休息。</p>\n      </section>\n\n      <section class=\"mission-card\" aria-label=\"守护任务\">\n        <div class=\"mission-kicker\"><span>第 <b id=\"round\">1</b> 轮 · <span id=\"world-name\">蓝湾晨光</span></span><div class=\"remaining\" aria-label=\"剩余练习时间\"><span>剩余 <b id=\"time\">30</b> 秒</span><progress id=\"timebar\" max=\"30000\" value=\"30000\"></progress></div></div>\n        <div class=\"mission-kicker\"><span>守护任务</span><span><b id=\"progress-count\">0</b> / 3</span></div>\n        <h2 id=\"goal-title\">准备一起出发</h2>\n        <ol class=\"mission-list\" id=\"mission-list\">\n          <li data-goal=\"light\"><span class=\"goal-icon\" aria-hidden=\"true\">✧</span><span><b>点亮城市</b><small>给窗户带来温暖光亮</small></span><span class=\"goal-state\">待开始</span></li>\n          <li data-goal=\"shield\"><span class=\"goal-icon\" aria-hidden=\"true\">○</span><span><b>温柔守护</b><small>为城市戴上一圈保护光环</small></span><span class=\"goal-state\">待开始</span></li>\n          <li data-goal=\"restore\"><span class=\"goal-icon\" aria-hidden=\"true\">♡</span><span><b>帮助伙伴</b><small>让小伙伴恢复开心</small></span><span class=\"goal-state\">待开始</span></li>\n        </ol>\n        <div class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">准备好就出发吧！</div>\n        <div class=\"row-actions\">\n          <button id=\"start\" type=\"button\" class=\"button primary\">开始练习</button>\n          <button id=\"retry\" type=\"button\" class=\"button primary\" hidden>再试一次</button>\n          <button id=\"next\" type=\"button\" class=\"button primary\" hidden>下一轮</button>\n          <button id=\"restart\" type=\"button\" class=\"button secondary\" hidden>重新开始</button>\n          <button id=\"stop\" type=\"button\" class=\"button secondary\" hidden>结束练习</button>\n        </div>\n        <p class=\"total\">累计收集 <strong id=\"total-stars\">0</strong> 颗星星</p>\n      </section>\n    </div>\n\n    <section class=\"practice-panel\" aria-label=\"选择输入方式和练习\">\n      <label class=\"input-choice\" for=\"input-mode\">输入方式 <select id=\"input-mode\"><option value=\"practice\">触屏练习（无相机）</option><option value=\"model\">相机体感（待真机验证）</option></select></label>\n      <div id=\"consent-controls\" hidden>\n        <p>相机体感仍待验证。仅在本机处理前置相机画面，不使用麦克风、不录制或上传。请成年人在场，并确认周围安全。</p>\n        <label><input id=\"adult-consent\" type=\"checkbox\" autocomplete=\"off\"> 我是成年人，明确同意本次开启相机；暂停、关闭或结束后需重新同意。</label>\n      </div>\n      <p id=\"camera-actions\" hidden>轻柔动作：自然放松、轻轻举手、双臂交叉或舒适的光线姿态。不要碰人，累了就休息。识别失败时可选择触屏练习。</p>\n      <video id=\"input-video\" class=\"input-video\" muted playsinline aria-hidden=\"true\"></video>\n      <div id=\"practice-heading\" class=\"practice-heading\"><h2>你的练习动作</h2><p>每次先点「放松」，再点当前任务。只是触屏练习，不需要做真实动作。</p></div>\n      <div class=\"practice-buttons\" id=\"poses\">\n        <button type=\"button\" class=\"pose-button neutral\" data-action=\"neutral\" disabled><span class=\"pose-icon\" aria-hidden=\"true\">◉</span><span>放松</span><small>回到自然状态</small></button>\n        <button type=\"button\" class=\"pose-button\" data-action=\"light\" disabled><span class=\"pose-icon\" aria-hidden=\"true\">✧</span><span>点亮</span><small>暖暖的光</small></button>\n        <button type=\"button\" class=\"pose-button\" data-action=\"shield\" disabled><span class=\"pose-icon\" aria-hidden=\"true\">○</span><span>守护</span><small>温柔光环</small></button>\n        <button type=\"button\" class=\"pose-button\" data-action=\"restore\" disabled><span class=\"pose-icon\" aria-hidden=\"true\">♡</span><span>帮助</span><small>伙伴笑起来</small></button>\n      </div>\n    </section>\n\n    <footer class=\"lab-note\">\n      <div><b>研发候选 · 非正式游戏</b><p>默认无相机触屏练习。相机体感只有成人明确同意并主动开始时才可请求，尚未验证真人识别及 iPhone。</p></div>\n      <div class=\"check-box\"><button type=\"button\" id=\"selfcheck\" class=\"button secondary\">运行规则自检</button><output id=\"check-result\" aria-live=\"polite\"></output></div>\n    </footer>\n  </main>\n</body>\n</html>\n","input-lifecycle.mjs":"// W25 local candidate. No environment side effects on import or construction.\n// Adult consent and a fresh explicit start are required for every session.\nimport { classifyPose, TRACK_GAP_MS } from './w11/gate.mjs';\nimport {prepareInputDetector} from './prepare-input-detector.mjs';\n\nexport const CAMERA_CONSTRAINTS = Object.freeze({\n  video:Object.freeze({facingMode:'user',width:Object.freeze({ideal:480}),\n    height:Object.freeze({ideal:270}),frameRate:Object.freeze({ideal:30})}),\n  audio:false\n});\nconst POINT_NAMES = ['left_shoulder','right_shoulder','left_wrist','right_wrist'];\nconst ACTIVE = new Set(['playing','paused']);\nfunction stopTracks(stream) {\n  for(const t of stream?.getTracks?.() ?? []) try{t.stop();}catch{}\n}\nfunction dispose(detector) {try {return Promise.resolve(detector?.dispose?.()).catch(()=>{});} catch{return Promise.resolve();}}\n\n// Copy only the four necessary anonymous points, never retain entire pose or image.\nexport function anonymousEnvelope(poses, at, width, height) {\n  const p=Array.isArray(poses)?poses[0]:null;\n  const keypoints=[];\n  for(const name of POINT_NAMES){\n    const matches=Array.isArray(p?.keypoints)?p.keypoints.filter(k=>k?.name===name):[];\n    if(matches.length!==1)continue;\n    const k=matches[0];\n    if([k.x,k.y,k.score].every(Number.isFinite))keypoints.push({name,x:k.x,y:k.y,score:k.score});\n  }\n  const poseScore=Number.isFinite(p?.score)?p.score:null;\n  return {timestampMs:at,sourceWidth:width,sourceHeight:height,\n    tracked:poseScore!==null&&classifyPose({keypoints}).valid,poseScore,keypoints};\n}\n\nexport function createInputLifecycle({\n  clock, requestStream, bindVideo, unbindVideo, readFrame, loadDetector,\n  readGeometry=()=>readFrame(),\n  schedule, unschedule, available=()=>true, onStatus=()=>{}, onResult=()=>{}, onInvalidated=()=>{}\n}) {\n  let current=null, busy=null, epoch=0, status='idle';\n  const live=s=>current===s&&!s.ended;\n  function publish(value,reason='') {sta