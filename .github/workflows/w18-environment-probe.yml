# W54 exact W52 startup UI plus no-camera practice; exact review required.
# Same strict W42 response security, anonymous practice only. T1 only.
name: W54 integrated T1 startup UI
on:
  push:
    branches: [ci/webgl-probe-w18]
    paths: [.github/workflows/w18-environment-probe.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Resolve and inspect exact reviewed tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/w40-probe"
          cd "$RUNNER_TEMP/w40-probe"
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --omit=optional --save-exact --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.58.2 playwright-core@1.58.2
          node <<'LOCK'
          const assert=require('node:assert/strict'), lock=require('./package-lock.json');
          const pins={
            playwright:'sha512-vA30H8Nvkq/cPBnNw4Q8TWz1EJyqgpuinBcHET0YVJVFldr8JDNiU9LaWAE1KqSkRYazuaBhTpB5ZzShOezQ6A==',
            'playwright-core':'sha512-yZkEtftgwS8CsfYo7nm0KE8jsvm6i/PTgVtB8DL726wNf6H2IMsDuxCpJj59KDaxCtSnrWan2AeDqM7JBaultg=='
          };
          for(const [n,h] of Object.entries(pins)){
            const p=lock.packages['node_modules/'+n];assert.equal(p.version,'1.58.2');assert.equal(p.integrity,h);
            assert.equal(p.resolved,'https://registry.npmjs.org/'+n+'/-/'+n+'-1.58.2.tgz');
          }
          for(const [p,d] of Object.entries(lock.packages)) if(p) assert(p==='node_modules/playwright'||p==='node_modules/playwright-core'||(p==='node_modules/fsevents'&&d.optional));
          LOCK
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org
          node -e 'for(const n of ["playwright","playwright-core"])if(require(n+"/package.json").version!=="1.58.2")process.exit(1)'
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          node node_modules/playwright/cli.js install webkit
