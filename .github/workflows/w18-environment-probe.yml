name: W19 published W9 proxy pair test
on:
  push:
    branches: [ci/webgl-probe-w18]
    paths: [.github/workflows/w18-environment-probe.yml]
permissions:
  contents: read
jobs:
  published-proxy:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Resolve exact dependency and inspect lock before install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w18-probe"
          cd "$RUNNER_TEMP/w18-probe"
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --omit=optional --save-exact --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.58.2 playwright-core@1.58.2
          node <<'JS'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const expected = {
            playwright: 'sha512-vA30H8Nvkq/cPBnNw4Q8TWz1EJyqgpuinBcHET0YVJVFldr8JDNiU9LaWAE1KqSkRYazuaBhTpB5ZzShOezQ6A==',
            'playwright-core': 'sha512-yZkEtftgwS8CsfYo7nm0KE8jsvm6i/PTgVtB8DL726wNf6H2IMsDuxCpJj59KDaxCtSnrWan2AeDqM7JBaultg=='
          };
          for (const [name, integrity] of Object.entries(expected)) {
            const p = lock.packages['node_modules/' + name];
            assert.equal(p.version, '1.58.2');
            assert.equal(p.integrity, integrity);
            assert.equal(p.resolved, 'https://registry.npmjs.org/' + name + '/-/' + name + '-1.58.2.tgz');
          }
          for (const [path,p] of Object.entries(lock.packages)) {
            if (!path) continue;
            assert(path === 'node_modules/playwright' || path === 'node_modules/playwright-core' || (path === 'node_modules/fsevents' && p.optional), 'unexpected dependency');
          }
          console.log('W18_LOCK_OK', JSON.stringify(expected));
          JS
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org
          node -e 'for (const n of ["playwright","playwright-core"]) { const v=require(n+"/package.json").version; if(v!=="1.58.2") process.exit(1); console.log(n,v); }'
      - name: Install official browser and supported runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/w18-probe"
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          node node_modules/playwright/cli.js install webkit
      - name: Test the frozen published game experiment without a camera
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/w18-probe"
          node <<'JS'
          const {webkit} = require('playwright');
          const crypto = require('node:crypto');
          const os = require('node:os');
          const base = 'https://hzp15abc-collab.github.io/my-first-website/ultral-man/g1b/';
          const manifest = {"NOTICE.txt":[3426,"90d5f9d4c60160b75b1a012b56142003105b78402289e7181ddf5c8259d4dc95"],"app.mjs":[36718,"6546c8f95b1bef623b46cd3bc6a1aeeea8a199978cf4b7315f8a4a5521a2be7d"],"frozen-config.json":[2813,"4c05d393824cea6c07bfec7a9f16fc746c1e90332c552a94c07fa8bfec096e88"],"group1-shard1of2.bin":[4194304,"b42c3232bf13b0efc691d3f0693dd3fc74404f709b1deee0a271828af6dbbea2"],"group1-shard2of2.bin":[455912,"8253ab965aa3122c08f331777ca395ce9ca19bb9e7cb278b99de1c46dbdeb6dc"],"index.html":[8797,"69be02d5ea9ff4d06ccddc8a3489c59d5d17d9e8051d2c57e0578caa5e7095e8"],"licenses/babylonjs-core-LICENSE.txt":[9226,"9362ea9ea17cb221a20cbbd63f404710834cc273d2a9a7b60314fd68ab702cd6"],"licenses/babylonjs-core-NOTICE.txt":[793,"7f85d099ce3c6e1900a45ee8d5b8fa405e760c746af687b3ee2081416e48f183"],"licenses/babylonjs-loaders-LICENSE.txt":[9226,"9362ea9ea17cb221a20cbbd63f404710834cc273d2a9a7b60314fd68ab702cd6"],"licenses/core-js-LICENSE.txt":[1064,"66c014a988c01fdfd53ea344563c0aca795b321c66fe619a0cf40049fe0912de"],"licenses/draco-LICENSE.txt":[11556,"5ad8c213095c573921d7388edf93f6a9f54490b8ebf3b165ae8ef1947cf70846"],"licenses/long-LICENSE.txt":[11560,"3ddf9be5c28fe27dad143a5dc76eea25222ad1dd68934a047064e56ed2fa40c5"],"licenses/meshoptimizer-LICENSE.txt":[1086,"9d665b55ed2643c4fc86594749427b031c7b3367e11760a73c6dc69c415b2d3f"],"licenses/pose-detection-LICENSE.txt":[11357,"58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd"],"licenses/regenerator-runtime-LICENSE.txt":[1080,"51887a3d47051ac2fce1210562e5b9fe0830a8a8fabeb272c2d586eeb18a05fd"],"licenses/seedrandom-LICENSE.txt":[1079,"7500bc57d010cde21006d88014d7191f36be1750894bfc4a01ce3844f1f9af2e"],"licenses/tfjs-LICENSE.txt":[11358,"cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"],"licenses/tfjs-layers-LICENSE.txt":[13216,"a79c269bc0e74de72571cea54c5f92ed74cbc6e8d1250a9fdb40357383d9dc4b"],"licenses/three-LICENSE.txt":[1081,"8b378ebe60e2fe500158cb0ac71cb5e8b7d92953c2abcc63a0eb90499653b5bc"],"licenses/tslib-CopyrightNotice.txt":[822,"da16ddb65f8ca390998fb99223d0112498b56b45784d00afd77ff8ce1ac4de8b"],"licenses/tslib-LICENSE.txt":[655,"210b19e543130388c68654b7497e967119ce17145f66ab7d85688fbd70f08751"],"model.json":[168013,"c65a3447162efa0c42af29498a4b151f4415b36ff3ae6fae2b28a32e840dcbfb"],"pose-detection.min.js":[72653,"eedb38254421de21571e88db202382104b98f36de221a94f956d7bd01f43abcd"],"scene.glb":[693828,"9a73e9b020a4e8e4672cc2a8dbbf30029bcde6cd0a468402a4fde729f26a1d53"],"style.css":[6552,"3c53b0307e33fa5663830a826658aea2aa9bb122111bb6bd52b8d1279025c601"],"t1.bundle.js":[623952,"40fae149dfb25bea6c81763178a5272a92f96a9a126ce070b4d810eb6ba09358"],"t1.bundle.js.LEGAL.txt":[188,"cc7cc7e2f53d5db0235ab2226e85fc6e91655161573b39813b41bb00e5919674"],"t2.bundle.js":[2851741,"e97554350679c9b38292adc2f31be2203ed01db7a4035ba910380f15ad13b133"],"tf.min.js":[1469833,"3daeec03303a884a0c1b3314a1dffad572c402ec941ee3638e9b9d64e450964b"]};
          const sha = b => crypto.createHash('sha256').update(b).digest('hex');
          const metadata = {scope:'frozen W9 proxy test only, not iPhone or game acceptance',runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,runner:process.env.RUNNER_OS,arch:process.arch,osRelease:os.release(),playwright:require('playwright/package.json').version,expectedBuild:'w8-g1b-c1a817371fcc1b25',manifestCount:Object.keys(manifest).length};
          const pairs = [['T1','render'],['T2','render'],['T1','synthetic'],['T2','synthetic']];
          const classify = u => {
            if (u === base) return 'index.html';
            if (!u.startsWith(base)) return null;
            const path=u.slice(base.length);
            return Object.hasOwn(manifest,path) ? path : null;
          };
          const result = {...metadata, cases:[], halted:false};
          async function test(browser,candidate,mode) {
            const out={candidate,mode,protocol:'quick',requests:[],responses:[],requestFailures:[],pageErrors:[],consoleErrors:[],violations:[],guard:null,report:null};
            const pending=[];
            const requestIds=new Map();let nextId=0;
            let context,page;
            let deadline=0;
            function note(s){out.violations.push(String(s).slice(0,500));}
            function register(req){
              if(requestIds.has(req))return requestIds.get(req);
              const p=classify(req.url()),method=req.method(),id=++nextId;
              requestIds.set(req,id);out.requests.push({id,path:p||'(unlisted URL)',method,redirect:!!req.redirectedFrom()});
              if(!p||method!=='GET'||req.redirectedFrom())note('unexpected request or redirect '+method+' '+(p||'(unlisted URL)'));
              return id;
            }
            async function state() {
              return page.evaluate(()=>({
                guard:window.__w19CameraGuard||null,
                source:document.querySelector('#source')?.textContent,
                consentDisabled:document.querySelector('#consent')?.disabled,
                consentChecked:document.querySelector('#consent')?.checked,
                candidate:document.querySelector('#candidate')?.value,
                mode:document.querySelector('#mode')?.value,
                protocol:document.querySelector('#protocol')?.value,
                width:document.querySelector('#stage')?.width,
                height:document.querySelector('#stage')?.height,
                streamPresent:!!document.querySelector('#camera')?.srcObject,
                status:document.querySelector('#status')?.textContent,
                frame:document.querySelector('#frame-count')?.textContent,
                infer:document.querySelector('#infer-count')?.textContent,
                report:document.querySelector('#report')?.textContent
              }));
            }
            function guardOK(s) { return s.guard?.installed===true && s.guard.calls===0 && s.consentDisabled===true && s.consentChecked===false && !s.streamPresent; }
            try {
              context=await browser.newContext({viewport:{width:1280,height:720},serviceWorkers:'block',permissions:[]});
              await context.addInitScript(()=>{
                const evidence={installed:false,calls:0};Object.defineProperty(window,'__w19CameraGuard',{value:evidence});
                try {
                  const md=navigator.mediaDevices;
                  if(!md||typeof md.getUserMedia!=='function')return;
                  const deny=()=>{evidence.calls++;return Promise.reject(new DOMException('Camera deliberately disabled for anonymous CI','NotAllowedError'));};
                  Object.defineProperty(md,'getUserMedia',{value:deny,configurable:false,writable:false});
                  evidence.installed=md.getUserMedia===deny;
                }catch{}
              });
              context.on('request',req=>register(req));
              context.on('requestfailed',req=>{const id=register(req);const path=classify(req.url());out.requestFailures.push({id,path:path||'(unlisted URL)',failure:req.failure()?.errorText||'unknown'});note('request failed '+(path||'(unlisted URL)'));});
              await context.route('**/*',async route=>{
                const req=route.request(), p=classify(req.url()), method=req.method();register(req);
                if(!p||method!=='GET'||req.redirectedFrom()){await route.abort();return;}
                await route.continue();
              });
              page=await context.newPage();
              page.on('dialog',d=>{note('unexpected dialog '+d.type());d.dismiss().catch(()=>{});});
              page.on('pageerror',e=>out.pageErrors.push(String(e).slice(0,500)));
              page.on('console',m=>{if(m.type()==='error'&&out.consoleErrors.length<30)out.consoleErrors.push(m.text().slice(0,500));});
              context.on('response',res=>{
                const path=classify(res.url());
                const id=requestIds.get(res.request());
                if(!path||id===undefined){note('unlisted or unmatched response');return;}
                if(res.status()>=300&&res.status()<400)note('unexpected redirect response '+path);
                pending.push((async()=>{
                  try{
                    const b=await res.body();const actual=[b.length,sha(b)];const ok=res.status()===200&&actual[0]===manifest[path][0]&&actual[1]===manifest[path][1];
                    out.responses.push({id,path,status:res.status(),bytes:actual[0],sha256:actual[1],ok});
                    if(!ok)note('response identity mismatch '+path);
                  }catch(e){note('response identity unreadable '+path);out.responses.push({id,path,status:res.status(),ok:false,error:String(e).slice(0,300)});}
                })());
              });
              await page.goto(base,{waitUntil:'load',timeout:20000});
              await Promise.all(pending);
              if(out.violations.length)throw Error('identity/network violation before interaction');
              await page.locator('#candidate').selectOption(candidate,{timeout:5000});
              await page.locator('#mode').selectOption(mode,{timeout:5000});
              await page.locator('#protocol').selectOption('quick',{timeout:5000});
              const before=await state();
              out.guard=before.guard;
              out.before={candidate:before.candidate,mode:before.mode,protocol:before.protocol,consentDisabled:before.consentDisabled,consentChecked:before.consentChecked,width:before.width,height:before.height};
              if(!guardOK(before)||before.candidate!==candidate||before.mode!==mode||before.protocol!=='quick'||before.width!==960||before.height!==540){note('unsafe or mismatched test UI');throw Error('preflight guard or UI mismatch');}
              if(!out.responses.some(x=>x.path==='index.html'&&x.ok)||!out.responses.some(x=>x.path==='app.mjs'&&x.ok)) {note('required startup identities unverified');throw Error('startup identity missing');}
              deadline=Date.now()+70000;
              await page.locator('#start').click({timeout:5000});
              while(Date.now()<deadline) {
                const s=await state();
                out.guard=s.guard;out.source=s.source;out.status=s.status;out.frameText=s.frame;out.inferText=s.infer;out.streamPresent=s.streamPresent;
                if(!guardOK(s)){note('camera guard/consent/stream violated');break;}
                if(out.violations.length)break;
                try{const parsed=JSON.parse(s.report);if(parsed.stopReason){out.report=parsed;break;}}catch{}
                await page.waitForTimeout(250);
              }
              if(!out.report&&!out.violations.length)out.timeout=true;
              await Promise.all(pending);
            } catch(e){out.error=String(e).slice(0,500);}
            finally{
              if(page){try{const s=await state();out.guard=s.guard;out.streamPresent=s.streamPresent;out.finalConsentChecked=s.consentChecked;out.finalConsentDisabled=s.consentDisabled;if(!guardOK(s))note('camera guard/consent/stream at final state');}catch(e){note('final camera state unverified');}}
              if(page)await page.close().catch(()=>{});
              if(context)await context.close().catch(()=>{});
              await Promise.allSettled(pending);
              out.checkedFiles=[...new Set(out.responses.filter(x=>x.ok).map(x=>x.path))].sort();
              out.notRequested=Object.keys(manifest).filter(x=>!out.requests.some(r=>r.path===x)).sort();
              const r=out.report;
              const requestedAllVerified=out.requests.every(q=>!q.redirect&&out.responses.filter(z=>z.id===q.id&&z.ok&&z.path===q.path).length===1)&&out.requestFailures.length===0;
              if(!requestedAllVerified)note('not all requested static resources verified');
              if(r?.network?.cspViolations?.length)note('application reported CSP violations');
              if(Object.keys(r?.network?.observedResourceCategories||{}).some(k=>['非同源','未列入静态清单的同源资源','无法识别的资源'].includes(k)))note('application observed resource outside its whitelist');
              const statsOK=s=>s&&Number.isInteger(s.n)&&s.n>0&&Number.isFinite(s.p50)&&Number.isFinite(s.p95);
              const networkOK=r?.network&&r.network.observedResourceCategories&&Array.isArray(r.network.cspViolations)&&r.network.cspViolations.length===0;
              const inputOK=mode==='render'?r?.input==='NO_CAMERA_RENDER_ONLY':typeof r?.input==='string'&&r.input.startsWith('SYNTHETIC_CANVAS_NO_CAMERA;');
              out.pass=!!(r&&r.candidate===candidate&&r.mode===mode&&r.protocol==='quick'&&r.completed===true&&r.stopReason==='protocol-complete'&&Number.isInteger(r.counts?.frames)&&r.counts.frames>0&&statsOK(r.frameIntervalsMs)&&networkOK&&inputOK&&(!r.errors||r.errors.length===0)&&out.violations.length===0&&!out.error&&!out.timeout&&out.pageErrors.length===0&&out.consoleErrors.length===0&&(!r.cameraDimensions)&&(!r.cameraTrackStates||r.cameraTrackStates.length===0)&&(mode==='render'?r.counts.inferences===0:(Number.isInteger(r.counts.inferences)&&r.counts.inferences>0&&statsOK(r.actualModelInferenceMs)&&r.backend==='webgl')));
              console.log('W19_CASE '+JSON.stringify(out));
            }
            return out;
          }
          (async()=>{
            let browser;
            try {
              browser=await webkit.launch({headless:true,timeout:30000});result.browserVersion=browser.version();
              for(const [candidate,mode] of pairs){const c=await test(browser,candidate,mode);result.cases.push({candidate,mode,pass:c.pass,frameCount:c.report?.counts?.frames,inferenceCount:c.report?.counts?.inferences,stopReason:c.report?.stopReason,violations:c.violations});if(c.violations.length){result.halted=true;break;}}
            }catch(e){result.error=String(e).slice(0,500);}
            finally {if(browser)await browser.close().catch(()=>{});console.log('W19_SUMMARY '+JSON.stringify(result));if(result.halted||result.error||result.cases.length!==4||result.cases.some(x=>!x.pass))process.exitCode=1;}
          })().catch(e=>{console.error(String(e));process.exitCode=1;});
          JS
