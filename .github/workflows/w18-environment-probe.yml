name: W18 isolated browser capability probe
on:
  push:
    branches: [ci/webgl-probe-w18]
    paths: [.github/workflows/w18-environment-probe.yml]
permissions:
  contents: read
jobs:
  capability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PROBE_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Resolve exact dependency and inspect lock before install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w18-probe"
          cd "$RUNNER_TEMP/w18-probe"
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --omit=optional --save-exact --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.58.2 playwright-core@1.58.2
          node <<'JS'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const expected = {
            playwright: 'sha512-vA30H8Nvkq/cPBnNw4Q8TWz1EJyqgpuinBcHET0YVJVFldr8JDNiU9LaWAE1KqSkRYazuaBhTpB5ZzShOezQ6A==',
            'playwright-core': 'sha512-yZkEtftgwS8CsfYo7nm0KE8jsvm6i/PTgVtB8DL726wNf6H2IMsDuxCpJj59KDaxCtSnrWan2AeDqM7JBaultg=='
          };
          for (const [name, integrity] of Object.entries(expected)) {
            const p = lock.packages['node_modules/' + name];
            assert.equal(p.version, '1.58.2');
            assert.equal(p.integrity, integrity);
            assert.equal(p.resolved, 'https://registry.npmjs.org/' + name + '/-/' + name + '-1.58.2.tgz');
          }
          for (const [path,p] of Object.entries(lock.packages)) {
            if (!path) continue;
            assert(path === 'node_modules/playwright' || path === 'node_modules/playwright-core' || (path === 'node_modules/fsevents' && p.optional), 'unexpected dependency');
          }
          console.log('W18_LOCK_OK', JSON.stringify(expected));
          JS
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org
          node -e 'for (const n of ["playwright","playwright-core"]) { const v=require(n+"/package.json").version; if(v!=="1.58.2") process.exit(1); console.log(n,v); }'
      - name: Install official browser and supported runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/w18-probe"
          unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
          if [ "$PROBE_BROWSER" = chromium ]; then
            node node_modules/playwright/cli.js install --with-deps chromium
          else
            node node_modules/playwright/cli.js install webkit
          fi
      - name: Measure generic WebGL pixel and WASM result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/w18-probe"
          node <<'JS'
          const pw = require('playwright');
          const os = require('node:os');
          const name = process.env.PROBE_BROWSER;
          const output = {scope:'generic proxy only, no game/camera or device claim',runner:process.env.RUNNER_OS,platform:process.platform,arch:process.arch,osRelease:os.release(),node:process.version,playwright:require('playwright/package.json').version,browser:name,runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA};
          const passPixel = v => v?.available && v.error === 0 && [64,128,191,255].every((n,i)=>Math.abs(n-v.pixel[i])<=1);
          (async()=>{
            let browser, context;
            try {
              if (!['chromium','webkit'].includes(name)) throw Error('unexpected browser');
              browser = await pw[name].launch(name === 'chromium' ? {headless:true,chromiumSandbox:true,timeout:30000} : {headless:true,timeout:30000});
              output.browserVersion = browser.version();
              context = await browser.newContext({serviceWorkers:'block'});
              await context.route('**/*', route => route.abort());
              const page = await context.newPage();
              await page.setContent('<!doctype html><html><title>W18 local capability only</title><body></body></html>');
              output.results = await page.evaluate(async()=>{
                const result = {url:location.href,ua:navigator.userAgent,secure:isSecureContext,webgl:{}};
                for (const kind of ['webgl2','webgl']) {
                  try {
                    const c=document.createElement('canvas');c.width=2;c.height=2;
                    const g=c.getContext(kind);
                    if (!g) { result.webgl[kind]={available:false};continue; }
                    g.clearColor(.25,.5,.75,1);g.clear(g.COLOR_BUFFER_BIT);
                    const p=new Uint8Array(4);g.readPixels(0,0,1,1,g.RGBA,g.UNSIGNED_BYTE,p);
                    const e=g.getError();const ext=g.getExtension('WEBGL_debug_renderer_info');
                    result.webgl[kind]={available:true,pixel:[...p],error:e,vendor:g.getParameter(g.VENDOR),renderer:g.getParameter(g.RENDERER),version:g.getParameter(g.VERSION),unmaskedRenderer:ext?g.getParameter(ext.UNMASKED_RENDERER_WEBGL):null};
                  } catch(e) { result.webgl[kind]={error:String(e)}; }
                }
                try {
                  const bytes=Uint8Array.of(0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,7,1,3,114,117,110,0,0,10,6,1,4,0,65,42,11);
                  const m=await WebAssembly.instantiate(bytes);result.wasm={value:m.instance.exports.run()};
                } catch(e) { result.wasm={error:String(e)}; }
                return result;
              });
              output.graphicPass=Object.values(output.results.webgl).some(passPixel);
              output.wasmPass=output.results.wasm.value===42;
              if (!output.graphicPass || !output.wasmPass) process.exitCode=1;
            } catch(e){ output.error=String(e);process.exitCode=1; }
            finally {
              if(context) await context.close().catch(()=>{});
              if(browser) await browser.close().catch(()=>{});
              console.log('W18_RESULT '+JSON.stringify(output));
            }
          })().catch(e=>{console.error(String(e));process.exitCode=1;});
          JS
