estAnimationFrame(f),unschedule:id=>windowRef.cancelAnimationFrame(id),\n    loadDetector:async (alive,invalidate)=>{\n      const aliveGuard=()=>{guard();if(!alive())throw Error('interrupted');};\n      aliveGuard();\n      let tf,backendReady=false;\n      return prepareInputDetector({\n        clock,setTimer:(f,ms)=>windowRef.setTimeout(f,ms),clearTimer:id=>windowRef.clearTimeout(id),\n        alive:()=>alive()&&valid()&&(!backendReady||tf.getBackend()==='webgl'),invalidate,\n        loadDetector:async()=>{\n          aliveGuard();await localScript('tf.min.js');aliveGuard();\n          await localScript('pose-detection.min.js');aliveGuard();\n          tf=windowRef.tf;const pd=windowRef.poseDetection;\n          if(!tf||!pd||!await tf.setBackend('webgl'))throw Error('backend unavailable');\n          aliveGuard();await tf.ready();aliveGuard();if(tf.getBackend()!=='webgl')throw Error('backend unavailable');\n          backendReady=true;\n          return pd.createDetector(pd.SupportedModels.MoveNet,{modelType:pd.movenet.modelType.SINGLEPOSE_LIGHTNING,\n            modelUrl:new URL('model.json',root).href,enableSmoothing:false});\n        },\n        zeros:(shape,dtype)=>{\n          aliveGuard();if(tf.getBackend()!=='webgl')throw Error('backend unavailable');\n          return tf.zeros(shape,dtype);\n        }\n      });\n    }\n  };\n}\n","prepare-input-detector.mjs":"// Session-local pre-active preparation. All side effects are injected by\n// the consent-gated caller; no browser, camera, model or controller on import.\nimport {createDetectorPreparation} from './readiness.mjs';\n\nexport async function prepareInputDetector({\n  clock,setTimer,clearTimer,alive,invalidate,loadDetector,zeros\n}) {\n  if(typeof alive!=='function'||typeof invalidate!=='function')throw Error('invalid preparation owner');\n  const checkOwner=()=>{if(!alive())throw Error('interrupted');};\n  const preparation=createDetectorPreparation({\n    clock,setTimer,clearTimer,timeoutMs:45000,\n    loadDetector:()=>{\n      checkOwner();\n      // Return a late detector to the helper even if the owner was stopped\n      // during loading: the helper owns and disposes that late arrival.\n      return loadDetector();\n    },\n    createTensor:()=>{checkOwner();return zeros([270,480,3],'int32');},\n    estimate:async(d,t)=>{\n      checkOwner();\n      if(t?.dtype!=='int32'||!Array.isArray(t.shape)||t.shape.join(',')!=='270,480,3'||typeof t.dispose!=='function'||\n        typeof d?.estimatePoses!=='function'||typeof d.reset!=='function'||typeof d.dispose!=='function')\n        throw Error('invalid preparation input');\n      await d.estimatePoses(t,{flipHorizontal:false}); // discard preparation result\n      checkOwner();\n    },\n    reset:async d=>{checkOwner();await d.reset();checkOwner();},\n    disposeTensor:async t=>{\n      await t.dispose();\n      if(t.isDisposed!==true)throw Error('tensor release failed');\n    },\n    disposeDetector:d=>d.dispose()\n  });\n  try{\n    const result=await preparation.start();\n    checkOwner();\n    if(result.state!=='READY'||result.elapsedMs>=45000||result.estimateCalls!==1||\n      result.resetCalls!==1||result.tensorDisposeCalls!==1||result.cleanupErrors!==0||\n      result.ownsTensor||!result.ownsDetector||result.pending)\n      throw Error('preparation incomplete');\n    return preparation.takeDetector();\n  }catch(error){\n    // Invalidate the current media session before any asynchronous drain.\n    // The lifecycle starting/busy lock is held until this promise settles.\n    try{invalidate();}finally{\n      let drained;\n      try{drained=await preparation.close();}\n      catch{invalidate('cleanup-unproven');throw error;}\n      if(!drained?.closed||drained.pending||drained.ownsDetector||drained.ownsTensor||drained.cleanupErrors!==0)\n        invalidate('cleanup-unproven');\n    }\n    throw error;\n  }\n}\n","readiness.mjs":"// W39 isolated readiness helpers. No direct model, browser, event or game APIs.\nconst IDLE='IDLE', PREPARING='PREPARING', READY='READY', ERROR='ERROR', CANCELLED='CANCELLED';\nconst validMs=(v,limit)=>Number.isFinite(v)&&v>0&&v<=limit;\nconst isFn=v=>typeof v==='function';\nconst failure=reason=>Object.assign(new Error(reason),{code:reason});\n\n// Clock and scheduler belong to this owner. setTimer/requestFrame must defer\n// callbacks; none of these functions are assumed able to abort in-flight work.\nfunction timedState({clock,setTimer,clearTimer,timeoutMs,maxMs,onTerminal=()=>{}}){\n  let state=IDLE,reason=null,startAt=null,lastAt=null,terminalAt=null,deadline=null;\n  let timer=null,timerArmed=false,resolveStart,rejectStart;\n  let cleanupErrors=0;\n  function time(){\n    const n=clock();\n    if(!Number.isFinite(n)||(lastAt!==null&&n<lastAt))throw failure('clock');\n    lastAt=n;return n;\n  }\n  function clear(){\n    if(timerArmed){timerArmed=false;try{clearTimer(timer);}catch{cleanupErrors++;}}\n    timer=null;\n  }\n  function terminal(next,why){\n    if(state!==PREPARING&&state!==IDLE)return false;\n    state=next;reason=why;terminalAt=lastAt;\n    clear();\n    try{onTerminal(next);}catch{cleanupErrors++;}\n    if(next===READY)resolveStart?.();else rejectStart?.(failure(why));\n    return true;\n  }\n  function active(){\n    if(state!==PREPARING)return false;\n    try{if(time()>=deadline){terminal(ERROR,'deadline');return false;}}\n    catch{terminal(ERROR,'clock');return false;}\n    return state===PREPARING;\n  }\n  function arm(){\n    if(!active())return;\n    try{\n      timerArmed=true;\n      timer=setTimer(()=>{timerArmed=false;timer=null;if(active())arm();},deadline-lastAt);\n    }catch{timerArmed=false;timer=null;terminal(ERROR,'timer');}\n  }\n  function begin(){\n    if(state!==IDLE)return Promise.reject(failure('one-shot'));\n    const p=new Promise((resolve,reject)=>{resolveStart=resolve;rejectStart=reject;});\n    state=PREPARING;\n    if(!validMs(timeoutMs,maxMs)||![clock,setTimer,clearTimer].every(isFn)){\n      terminal(ERROR,'dependencies');return p;\n    }\n    try{startAt=time();deadline=startAt+timeoutMs;}\n    catch{terminal(ERROR,'clock');return p;}\n    arm();return p;\n  }\n  function base(){return {state,reason,elapsedMs:startAt===null?null:(terminalAt??lastAt)-startAt,cleanupErrors};}\n  return {begin,active,terminal,base,get state(){return state;},cancel:()=>terminal(CANCELLED,'cancelled'),cleanupError:()=>{cleanupErrors++;}};\n}\n\n/** One preparation estimate only; discarded result and owned resources. */\nexport function createDetectorPreparation({clock,setTimer,clearTimer,loadDetector,createTensor,estimate,reset,disposeTensor,disposeDetector,timeoutMs=45000}={}){\n  const t=timedState({clock,setTimer,clearTimer,timeoutMs,maxMs:45000});\n  let detector=null,tensor=null,working=false,cleanupPending=0,closed=false,transferred=false;\n  let runPromise=Promise.resolve(),closePromise=null;\n  let estimateCalls=0,resetCalls=0,tensorDisposeCalls=0,detectorDisposeCalls=0;\n  function snapshot(){return {...t.base(),ownsDetector:detector!==null,ownsTensor:tensor!==null,\n    pending:working||cleanupPending!==0,closed,transferred,estimateCalls,resetCalls,tensorDisposeCalls,detectorDisposeCalls};}\n  async function releaseTensor(){\n    if(tensor===null)return true;\n    const item=tensor;tensor=null;tensorDisposeCalls++;cleanupPending++;\n    try{await disposeTensor(item);return true;}catch{t.cleanupError();return false;}finally{cleanupPending--;}\n  }\n  async function releaseDetector(){\n    if(detector===null)return true;\n    const item=detector;detector=null;detectorDisposeCalls++;cleanupPending++;\n    try{await disposeDetector(item);return true;}catch{t.cleanupError();return false;}finally{cleanupPending--;}\n  }\n  async function run(){\n    working=true;let stage='load';let prepared=false;\n    try{\n      detector=await loadDetector();\n      if(detector==null){detector=null;throw failure('load');} // own a late arrival too\n      if(!t.active())return;\n      stage='tensor';tensor=await createTensor();\n      if(tensor==null){tensor=null;throw failure('tensor');}\n      if(!t.active())return;\n      stage='estimate';estimateCalls++;await estimate(detector,tensor); // no result retention\n      if(!t.active())return;\n      stage='reset';resetCalls++;await reset(detector);\n      if(!t.active())return;\n      stage='tensor-cleanup';if(!await releaseTensor())throw failure(stage);\n      if(!t.active())return;\n      prepared=true;\n    }catch{if(t.active())t.terminal(ERROR,stage);}\n    finally{\n      // A cancellation/deadline settles the public promise immediately, but\n      // never disposes an input or detector before dependent work settles.\n      if(!prepared||t.state!==PREPARING){await releaseTensor();await releaseDetector();}\n      working=false;\n      if(prepared){\n        if(t.active())t.terminal(READY,'ready');\n        else await releaseDetector();\n      }\n    }\n  }\n  function start(){\n    if(t.state!==IDLE)return Promise.reject(failure('one-shot'));\n    const p=t.begin();\n    if(t.state===PREPARING){\n      if(![loadDetector,createTensor,estimate,reset,disposeTensor,disposeDetector].every(isFn))t.terminal(ERROR,'dependencies');\n      else runPromise=run();\n    }\n    return p.then(snapshot);\n  }\n  function close(){\n    if(closePromise)return closePromise;\n    closed=true;t.cancel();\n    closePromise=(async()=>{await runPromise;await releaseTensor();await releaseDetector();return snapshot();})();\n    return closePromise;\n  }\n  function takeDetector(){\n    if(closed||t.state!==READY||detector===null||working||cleanupPending)throw failure('not-owned-ready');\n    const item=detector;detector=null;transferred=true;closed=true;return item;\n  }\n  async function drained(){await runPromise;if(closePromise)await closePromise;return snapshot();}\n  return Object.freeze({start,cancel:t.cancel,close,takeDetector,drained,snapshot});\n}\n\n/** Strict first scene draw proof. Counter must belong to one scene/context.\n * draw, readCounter and contextLost are synchronous injected observations.\n * READY retains ownership until close; errors/cancel release exactly once.\n */\nexport function createFirstDrawReadiness({clock,setTimer,clearTimer,requestFrame,cancelFrame,readCounter,contextLost,draw,cleanup,timeoutMs=15000}={}){\n  let frame=null,frameArmed=false,epoch=0,lastCounter=null,drawCalls=0,delta=0;\n  let cleanupCalls=0,cleanupPromise=null,closed=false,cleaning=false,stageCode=null;\n  const t=timedState({clock,setTimer,clearTimer,timeoutMs,maxMs:15000,onTerminal(next){\n    epoch++;clearFrame();if(next!==READY)void release();\n  }});\n  function snapshot(){return {...t.base(),stageCode,drawCalls,counter:lastCounter,delta,cleanupCalls,pending:cleaning,closed};}\n  function clearFrame(){if(frameArmed){frameArmed=false;try{cancelFrame(frame);}catch{t.cleanupError();}}frame=null;}\n  function release(){\n    if(cleanupPromise)return cleanupPromise;\n    closed=true;cleaning=true;\n    cleanupPromise=Promise.resolve().then(()=>{\n      if(isFn(cleanup)){cleanupCalls++;return cleanup();}\n      t.cleanupError();\n    }).catch(()=>{t.cleanupError();stageCode='cleanup';}).finally(()=>{cleaning=false;});\n    return cleanupPromise;\n  }\n  function fail(code){stageCode=code;t.terminal(ERROR,code);}\n  function count(){\n    const n=readCounter();\n    if(!Number.isSafeInteger(n)||n<0||(lastCounter!==null&&n<lastCounter))throw failure('unknown');\n    lastCounter=n;return n;\n  }\n  function probe(){\n    if(!t.active())return;\n    try{\n      if(contextLost()!==false){fail('context-lost');return;}\n      const before=count();drawCalls++;\n      // A synchronous API contract keeps a late/in-flight frame from masquerading as proof.\n      const result=draw();if(result&&isFn(result.then)){Promise.resolve(result).catch(()=>{});fail('draw');return;}\n      if(!t.active())return;\n      if(contextLost()!==false){fail('context-lost');return;}\n      const after=count();if(!t.active())return;\n      if(after>before){delta=after-before;t.terminal(READY,'ready');return;}\n      const mine=++epoch;frameArmed=true;\n      frame=requestFrame(()=>{\n        if(mine!==epoch||t.state!==PREPARING)return;\n        epoch++;frameArmed=false;frame=null;probe();\n      });\n    }catch(e){fail(e?.code==='unknown'?'unknown':'draw');}\n  }\n  function start(){\n    if(t.state!==IDLE)return Promise.reject(failure('one-shot'));\n    const p=t.begin();\n    if(t.state===PREPARING){\n      if(![requestFrame,cancelFrame,readCounter,contextLost,draw,cleanup].every(isFn))fail('visual-init');\n      else probe();\n    }\n    return p.then(snapshot);\n  }\n  async function close(){t.cancel();await release();return snapshot();}\n  async function drained(){if(cleanupPromise)await cleanupPromise;return snapshot();}\n  return Object.freeze({start,cancel:t.cancel,close,drained,snapshot});\n}\n","experience.mjs":"// W25 isolated candidate: practice by default; optional adult-consented\n// local body input. Real camera and model behavior still unverified.\nimport { createCityGuardian } from './w10/logic/city-guardian.mjs';\nimport { createPoseGate, TRACK_GAP_MS } from './w11/gate.mjs';\nimport { createExperienceController, runSemanticPracticeCheck } from './controller.mjs';\nimport { createVisual } from './visual.mjs';\nimport { createAudio } from './audio.mjs';\nimport { createInputLifecycle, browserInputDependencies } from './input-lifecycle.mjs';\n\nconst $ = id => document.getElementById(id);\nconst now = () => performance.now();\nlet inputSource='practice';\nconst newController = (source=inputSource) => createExperienceController({createCityGuardian, createPoseGate,\n  trackGapMs: TRACK_GAP_MS, source});\nconst titles = {light:'先点亮我们的城市',shield:'给城市戴上光环',restore:'让小伙伴笑起来'};\nconst hints = {light:'先点放松，再点点亮。',shield:'先点放松，再点守护。',restore:'先点放松，再点帮助。'};\nconst words = {'round-start':'新的一轮开始，先放松一下。','round-retry':'休息好了，再试一次！',\n  'light-ready':'太棒了！城市窗户亮起来啦。','shield-ready':'漂亮！保护光环出现啦。',\n  'friend-ready':'小伙伴开心地笑了！','round-success':'三颗星星！大家都很开心。',\n  'gentle-hint':'没关系，先放松，再尝试当前任务。','break':'时间到了，休息一下也很棒。',\n  'paused':'休息一下。准备好再继续。','resumed':'欢迎回来，先点放松。'};\nconst selectors = ['hero','friend','city','engine'].map($);\nconst buttons = Array.from(document.querySelectorAll('#poses button'));\nconst goals = Array.from(document.querySelectorAll('#mission-list li'));\nlet controller = newController(), state = controller.snapshot();\nlet visual = null, audio = null, visualLoading = false, visualVersion = 0, closed = false;\nlet chain = Promise.resolve(), frame = null, uiKey = '', muted = false, audioReady = false, visualTime = 0, lastFrameAt = null;\n// W52 DISPLAY ONLY: pure existing-snapshot-to-copy mapping; no control calls.\n/* display-map-start */\nfunction inputDisplay({model,media,state,consented}) {\n  const item=(code,label,detail,guide,heading)=>({code,pill:'相机体感 · '+label,status:label+' · '+detail,guide,heading});\n  if(!model)return {code:'practice',pill:'触屏练习 · 无相机',status:'',guide:'',heading:''};\n  if(media.status==='error')return item('error','相机不可用',media.busy?'已停止相机，正在等待本次资源释放。':'请成年人重新同意后主动开始或继续。','相机不可用，可改用触屏练习。','相机暂不可用');\n  if(media.status==='stopped'||state.stopped)return item('stopped','相机已关闭',media.busy?'正在等待本次资源释放。':'再次使用需成年人重新同意。','相机已关闭，可改用触屏练习。','先休息一下');\n  if(media.active&&media.status==='requesting')return item('requesting','等待相机授权','请成年人处理系统的相机权限提示。','等待成年人确认相机权限。','等待相机授权');\n  if(media.active&&media.status==='loading')return item('loading','正在准备本地识别','首次启动可能需要等待，请稍候；仍可关闭相机。','正在准备识别，请稍候。','正在准备识别');\n  if(media.active&&media.status==='running'){\n    if(state.tracking===true&&state.phase==='playing'&&!state.pauseReasons.includes('manual'))return item('tracked','已识别身体','已收到有效识别，请按当前任务轻柔练习。','已识别身体，请看任务提示。','开始练习');\n    if(state.pauseReasons.includes('manual'))return item('waiting','练习暂停','请先休息，继续前需重新同意相机。','先休息，准备好再继续。','先休息一下');\n    return item('waiting','等待身体识别','本地识别已准备；请自然站立，保持舒适距离。','等待识别，请自然站立。','等待身体识别');\n  }\n  return item('idle','相机未开启',media.busy?'正在等待本次资源释放。':consented?'已勾选同意，请主动开始或继续。':'请成年人明确同意，再主动开始。',consented?'请主动开始体感。':'请成年人确认相机同意。','准备一起出发');\n}\n/* display-map-end */\nconst input = createInputLifecycle({\n  ...browserInputDependencies({video:$('input-video'),clock:now}),\n  onStatus(status,reason){\n    renderUI(true);\n  },\n  onResult(owner,result){if(owner===controller)apply(result);},\n  onInvalidated(owner){\n    $('adult-consent').checked=false;\n    if(owner===controller&&!state.stopped&&['playing','paused'].includes(state.phase)&&!state.pauseReasons.includes('manual'))\n      apply(owner.command('pause',now()));\n    renderUI(true);\n  }\n});\nconst chosen = () => Object.fromEntries(selectors.map(el=>[el.id,el.value]));\nfunction showFeedback(text) { $('feedback').textContent=text; }\nfunction safePromise(p) { Promise.resolve(p).catch(()=>{}); }\nfunction setVisualStatus(text, failed = false) {\n  const node=$('visual-status');node.textContent=text;node.hidden=!text;node.classList.toggle('is-error',failed);\n}\nfunction disposeVisual(v=visual) {\n  if (v === visual) visual=null;\n  if (v) try { safePromise(v.dispose()); } catch {}\n}\nfunction disposeAudio() {\n  const old=audio;audio=null;audioReady=false;\n  if(old)try {safePromise(old.dispose());} catch {}\n}\nfunction currentVolume() { return muted ? 0 : Number($('volume').value); }\nfunction applyVolume() {\n  $('mute').textContent=muted?'开启声音':'静音';\n  $('mute').setAttribute('aria-pressed', String(muted));\n  if(audio)try{safePromise(audio.setVolume(document.hidden?0:currentVolume()));}catch{}\n}\nasync function prepareAudio() {\n  // A real user click is required before unlock; no autoplay.\n  try {\n    if(!audio) audio=createAudio();\n    const a=audio;\n    applyVolume(); const unlocked=await a.unlock();\n    if(audio!==a || closed || state.stopped){return;}\n    audioReady=unlocked===true;\n    $('volume').title=audioReady?'':'声音暂不可用；练习不受影响';\n    $('audio-state').hidden=audioReady;\n  } catch { $('volume').title='声音暂不可用；练习不受影响'; $('audio-state').hidden=false; }\n}\nfunction renderUI(force=false) {\n  const s=state;\n  const model=inputSource==='model', media=input.snapshot();\n  const display=inputDisplay({model,media,state:s,consented:$('adult-consent').checked});\n  const allowMedia=!model||($('adult-consent').checked&&!media.busy);\n  const key=JSON.stringify([s.phase,s.outcome,s.completedGoals,s.totalStars,s.round,Math.ceil(s.remainingMs/1000),s.armed,s.stopped,visualLoading,model,media.status,media.busy,$('adult-consent').checked,s.tracking,s.pauseReasons,media.active]);\n  if(!force && key===uiKey)return; uiKey=key;\n  $('round').textContent=s.round;\n  $('progress-count').textContent=s.completedGoals;\n  $('total-stars').textContent=s.totalStars;\n  $('time').textContent=Math.ceil(s.remainingMs/1000);\n  $('timebar').max=s.roundDurationMs; $('timebar').value=s.remainingMs;\n  $('stars').setAttribute('aria-label',`本轮星星 ${s.roundStars} 颗`);\n  Array.from($('stars').children).forEach((el,i)=>{\n    const earned=i<s.roundStars;el.textContent=earned?'★':'☆';el.classList.toggle('earned',earned);\n  });\n  const live=s.phase==='playing';\n  const active=['playing','paused'].includes(s.phase)&&!s.stopped;\n  for(let i=0;i<goals.length;i++){\n    const el=goals[i],done=i<s.completedGoals,current=active&&i===s.completedGoals;\n    el.classList.toggle('done',done);el.classList.toggle('active',current);\n    if(current)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');\n    el.querySelector('.goal-state').textContent=done?'已完成':current?'进行中':'待开始';\n  }\n  for(const b of buttons){\n    const enabled=live&&!s.stopped&&!model;\n    b.disabled=!enabled;\n    b.classList.toggle('next-action',enabled&&b.dataset.action===(s.armed?s.nextGoal?.action:'neutral'));\n  }\n  $('start').hidden=!(s.controls.canStart||s.stopped);\n  $('start').disabled=visualLoading||!allowMedia;\n  $('start').textContent=model?'同意后开始体感':s.stopped?'开始新练习':'开始练习';\n  $('pause').hidden=!(live&&!s.stopped);\n  $('resume').hidden=!(s.phase==='paused'&&s.pauseReasons.includes('manual')&&!s.stopped);\n  $('retry').hidden=!(s.controls.canRetry&&!s.stopped);\n  $('next').hidden=!(s.controls.canNext&&!s.stopped);\n  $('retry').disabled=visualLoading||!allowMedia;$('next').disabled=visualLoading||!allowMedia;\n  $('restart').hidden=!(s.phase==='complete'&&!s.stopped);\n  $('restart').disabled=visualLoading||!allowMedia;\n  $('resume').disabled=!allowMedia;\n  $('consent-controls').hidden=!model;\n  $('practice-heading').hidden=model;\n  $('poses').hidden=model;\n  $('camera-actions').hidden=!model;\n  $('input-status').hidden=!model;\n  $('camera-status-panel').hidden=!model;\n  if($('input-status').textContent!==display.status)$('input-status').textContent=display.status;\n  $('camera-status-panel').dataset.display=display.code;\n  $('mode-pill').textContent=display.pill;\n  $('mode-pill').dataset.display=display.code;\n  $('compact-input-mode').textContent=$('mode-pill').textContent;\n  $('rotate-input-hint').textContent=model?'横放设备观看更完整；旋转时相机会关闭，需成年人重新同意。':'横放设备，守护城市会看得更完整。也可以继续竖屏触屏练习。';\n  $('input-close').hidden=!model||!media.active;\n  $('stop').hidden=!(active||s.phase==='complete'&&!s.stopped);\n  for(const select of selectors) select.disabled=active;\n  if(s.stopped){$('goal-title').textContent='练习结束啦';$('goal-hint').textContent='可以换个伙伴，开始新的练习。';}\n  else if(s.phase==='ready'){$('goal-title').textContent='准备一起出发';$('goal-hint').textContent=model?display.guide:'选好英雄和伙伴，再点开始练习。';}\n  else if(s.phase==='paused'){$('goal-title').textContent=model?display.heading:'先休息一下';$('goal-hint').textContent=model?display.guide:'时间会等待你。继续之前记得放松。';}\n  else if(s.phase==='complete'){\n    $('goal-title').textContent=s.outcome==='success'?'守护完成！':'今天也很棒！';\n    $('goal-hint').textContent=s.outcome==='success'?'收集了三颗星星。再玩一轮，或者休息一下。':'不用着急，休息后可以继续未完成的任务。';\n  } else {\n    $('goal-title').textContent=titles[s.nextGoal.action];\n    $('goal-hint').textContent=model?(s.armed?s.nextGoal.hint:'先自然放松，准备下一步。'):\n      s.armed?`好了！点「${{light:'点亮',shield:'守护',restore:'帮助'}[s.nextGoal.action]}」。`:hints[s.nextGoal.action];\n  }\n}\nfunction apply(result) {\n  if(!result)return;\n  state=result.state;\n  const messages=result.effects.map(e=>words[e.kind]).filter(Boolean);\n  if(messages.length)showFeedback(messages.at(-1));\n  if(audio&&audioReady&&result.effects.length)try{safePromise(audio.play(result.effects));}catch{}\n  renderUI();\n  if(inputSource==='model'&&(state.phase==='complete'||state.stopped))input.stop('round-ended');\n}\nfunction cancelFrame(){if(frame!==null){cancelAnimationFrame(frame);frame=null;}lastFrameAt=null;}\nfunction ensureFrame(){if(frame===null&&!closed&&!document.hidden&&!state.stopped)frame=requestAnimationFrame(tickFrame);}\nfunction tickFrame(at) {\n  frame=null;\n  if(closed||document.hidden||state.stopped)return;\n  apply(controller.tick(now()));\n  if(lastFrameAt!==null&&state.phase!=='paused')visualTime+=Math.max(0,at-lastFrameAt);\n  lastFrameAt=at;\n  if(visual){\n    try{\n      visual.draw(visualTime,state);\n      if(!visualLoading&&!$('visual-status').classList.contains('is-error'))setVisualStatus('');\n    }catch{\n      disposeVisual();setVisualStatus('3D 预览暂不可用 · 仍可进行规则练习',true);\n    }\n  }\n  ensureFrame();\n}\nfunction preview() {\n  // Serialize asynchronous engine creation, use a fresh canvas for each\n  // candidate, and discard a superseded load without interleaving contexts.\n  const version=++visualVersion;\n  const selection=chosen();\n  $('world-name').textContent=$('city').selectedOptions[0].textContent;\n  visualLoading=true;setVisualStatus('正在准备原创 3D 场景…');renderUI(true);\n  chain=chain.catch(()=>{}).then(async()=>{\n    if(closed||version!==visualVersion)return;\n    disposeVisual();\n    const old=$('scene');\n    const canvas=old.cloneNode(false);old.replaceWith(canvas);\n    try{\n      const created=await createVisual(canvas,selection);\n      if(closed||version!==visualVersion||state.stopped){disposeVisual(created);return;}\n      if(!created||typeof created.draw!=='function'||typeof created.dispose!=='function')throw new Error('invalid visual adapter');\n      visual=created;visualTime=0;lastFrameAt=null;\n      setVisualStatus('场景已准备，等待首次绘制…');\n    }catch{\n      if(!closed&&version===visualVersion)setVisualStatus('3D 预览暂不可用 · 仍可进行规则练习',true);\n    } finally {\n      if(version===visualVersion){visualLoading=false;renderUI(true);ensureFrame();}\n    }\n  });\n}\nfunction startNew() {\n  if(inputSource==='model'){\n    if(!$('adult-consent').checked||input.snapshot().busy)return;\n    if(state.stopped){controller=newController();state=controller.snapshot();uiKey='';closed=false;preview();}\n    startModelCommand('start');return;\n  }\n  if(state.stopped){\n    controller=newController();state=controller.snapshot();uiKey='';closed=false;preview();\n    safePromise(prepareAudio());\n    const nextController=controller;\n    chain.then(()=>{if(!closed&&!document.hidden&&controller===nextController&&state.controls.canStart){apply(controller.command('start',now()));ensureFrame();}});\n    return;\n  }\n  // Only when the player starts do we initialize sound. If 3D preview is\n  // still loading the initial start button is disabled by renderUI.\n  safePromise(prepareAudio());\n  apply(controller.command('start',now()));ensureFrame();\n}\nfunction stopSession() {\n  $('adult-consent').checked=false;\n  input.stop('user-stop');\n  apply(controller.stop(now()));\n  cancelFrame();visualVersion++;visualLoading=false;\n  disposeVisual();disposeAudio();setVisualStatus('已结束 · 3D 资源已请求释放');\n  showFeedback('今天也很棒，休息一下吧！');renderUI(true);\n}\nfunction startModelCommand(id){\n  if(inputSource!=='model'||!$('adult-consent').checked||input.snapshot().busy)return;\n  safePromise(prepareAudio());\n  const owner=controller;\n  const result=owner.command(id,now());\n  apply(result);\n  if(!result.accepte